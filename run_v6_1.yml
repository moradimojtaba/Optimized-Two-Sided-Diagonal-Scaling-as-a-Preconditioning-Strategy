name: Run V6.1 benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - 'code/illcondition_v6_1.py'
      - 'requirements.txt'
      - '.github/workflows/run_v6_1.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run V6.1
        run: python code/illcondition_v6_1.py

      - name: Validate core outputs
        run: |
          test -f illcondition_v6_results/all_method_results.csv
          test -f illcondition_v6_results/method_summary.csv
          test -f illcondition_v6_results/solver_results_all.csv
          test -f illcondition_v6_results/scalability_results.csv
          test -f illcondition_v6_results/all_results.xlsx
          test -f illcondition_v6_results/configuration.json
          test -f illcondition_v6_results/run_report.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: illcondition-v6.1-results
          path: illcondition_v6_results/
          if-no-files-found: error
          retention-days: 30
